<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Battle sprite pipeline</title>
  <desc id="desc">A generated high-resolution sheet is chroma-keyed, then downscaled. A plain resize averages neighbouring colours and destroys the art; modal sampling keeps the hard edges and rebuilds the outline. Every action goes through one downscale call so they share a scale factor and a palette.</desc>

  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8494"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0674f"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f7d5c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="440" rx="10" fill="#f7f8fa"/>

  <text x="26" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1c2330">From a text prompt to frames a game can ship</text>
  <text x="26" y="66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#5a6474">Image models cannot draw at 64&#215;64. Shrinking is where the art dies.</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">

    <rect x="26" y="98" width="168" height="98" rx="8" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.5"/>
    <text x="110" y="128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2330">image_gen</text>
    <text x="110" y="150" text-anchor="middle" font-size="11.5" fill="#5a6474">2&#215;2 grid, one action</text>
    <text x="110" y="168" text-anchor="middle" font-size="11.5" fill="#5a6474">solid #FF00FF ground</text>
    <text x="110" y="186" text-anchor="middle" font-size="11.5" fill="#5a6474">~1250px per sheet</text>

    <path d="M198 147 H242" stroke="#7b8494" stroke-width="2" fill="none" marker-end="url(#grey)"/>

    <rect x="248" y="98" width="152" height="98" rx="8" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.5"/>
    <text x="324" y="128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2330">chroma-key</text>
    <text x="324" y="150" text-anchor="middle" font-size="11.5" fill="#5a6474">magenta to alpha</text>
    <text x="324" y="168" text-anchor="middle" font-size="11.5" fill="#5a6474">snapshot a master,</text>
    <text x="324" y="186" text-anchor="middle" font-size="11.5" fill="#5a6474">then work from it</text>

    <path d="M404 130 C 444 130, 442 70, 478 70" stroke="#c0674f" stroke-width="2" fill="none" marker-end="url(#red)"/>
    <path d="M404 164 C 444 164, 442 240, 478 240" stroke="#4f7d5c" stroke-width="2" fill="none" marker-end="url(#green)"/>

    <rect x="482" y="30" width="372" height="80" rx="8" fill="#fdf0ed" stroke="#c0674f" stroke-width="1.5"/>
    <text x="502" y="56" font-size="14.5" font-weight="700" fill="#9c3f2c">Plain resize &#8212; wrong</text>
    <text x="502" y="78" font-size="12.5" fill="#1c2330">Averages source colours into every output pixel.</text>
    <text x="502" y="96" font-size="12.5" fill="#1c2330">Edges soften, the outline dies, the face smudges.</text>

    <rect x="482" y="130" width="372" height="220" rx="8" fill="#eef5f0" stroke="#4f7d5c" stroke-width="1.5"/>
    <text x="502" y="156" font-size="14.5" font-weight="700" fill="#2b5a3b">Modal sampling &#8212; right</text>
    <text x="502" y="179" font-size="12.5" fill="#1c2330">Takes the most common colour in each source block, so</text>
    <text x="502" y="197" font-size="12.5" fill="#1c2330">hard edges survive. Then rebuild the 1px outline,</text>
    <text x="502" y="215" font-size="12.5" fill="#1c2330">anchor on the feet, and share one palette.</text>

    <rect x="502" y="232" width="332" height="100" rx="6" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.5"/>
    <text x="518" y="255" font-size="11.5" fill="#5a6474">one call &#8212; every action together</text>
    <text x="518" y="278" font-size="12.5" fill="#1c2330">idle + walk + attack, one scale, one palette</text>
    <text x="518" y="301" font-size="11.5" fill="#5a6474">separate calls give each action its own scale, so</text>
    <text x="518" y="319" font-size="11.5" fill="#5a6474">the character resizes the moment it attacks</text>

    <path d="M668 354 V 388" stroke="#4f7d5c" stroke-width="2" fill="none" marker-end="url(#green)"/>
    <rect x="482" y="392" width="372" height="34" rx="6" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.5"/>
    <text x="668" y="414" text-anchor="middle" font-size="12.5" fill="#1c2330">64&#215;64 transparent frames, one shared feet line</text>

    <rect x="26" y="232" width="374" height="194" rx="8" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.5"/>
    <text x="46" y="260" font-size="14.5" font-weight="700" fill="#1c2330">Three prompt rules, all required</text>
    <text x="46" y="288" font-size="12.5" fill="#1c2330">1. The head is one third of the figure's height.</text>
    <text x="62" y="306" font-size="11.5" fill="#5a6474">&#8220;3 heads tall&#8221; alone yields 4&#8211;5 heads and an unreadable face.</text>
    <text x="46" y="334" font-size="12.5" fill="#1c2330">2. Authored at the delivery pixel budget, shown</text>
    <text x="62" y="352" font-size="12.5" fill="#1c2330">upscaled with nearest-neighbour.</text>
    <text x="62" y="370" font-size="11.5" fill="#5a6474">&#8220;Pixel art&#8221; alone yields a painting with a pixel filter.</text>
    <text x="46" y="398" font-size="12.5" fill="#1c2330">3. The character acts toward the right.</text>
    <text x="62" y="416" font-size="11.5" fill="#5a6474">Engines mirror with flip_h; a left swing plays backwards.</text>

  </g>
</svg>
